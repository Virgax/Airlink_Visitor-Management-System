name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitas_test
  APP_URL: http://localhost:3000
  APP_ENCRYPTION_KEY: ci-app-encryption-key-0123456789abcdef0123456789abcdef
  PASS_SIGNING_KEY: ci-pass-signing-key-0123456789abcdef0123456789abcdef
  DOC_HASH_KEY: ci-doc-hash-key-0123456789abcdef0123456789abcdef
  SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
  CRON_SECRET: ci-cron-secret
  SEED_ADMIN_EMAIL: admin@airlink.test
  SEED_ADMIN_PASSWORD: Admin12345!
  NOTIFY_FAKE: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visitas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
